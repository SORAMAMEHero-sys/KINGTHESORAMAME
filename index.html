<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>そらまめゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #e8f5e9;
      color: #2e7d32;
      padding-top: 20px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      position: relative;
      margin: 0;
    }
    .score-board {
      font-size: 2rem;
      margin: 10px 0;
      font-weight: bold;
    }

    /* そらまめと農家の人たちの表示エリア */
    .game-stage {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      min-height: 120px;
    }

    .mame-btn {
      font-size: 6rem;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.03s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
      z-index: 10;
    }
    .mame-btn:active {
      transform: scale(0.8);
    }

    /* 🌾 接近してくる農家の人アニメーション 🌾 */
    .farmer-container {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .farmer-char {
      font-size: 3.5rem;
      animation: walkIn 0.8s ease-out forwards;
    }

    @keyframes walkIn {
      0% {
        transform: scale(0) translateY(50px);
        opacity: 0;
      }
      70% {
        transform: scale(1.3) translateY(-10px);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    /* 強化メニューボタン */
    .menu-open-btn {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 30px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* モーダル背景 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    /* モーダル本体 */
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 85%;
      max-width: 320px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 5px;
    }
    .shop-btn {
      font-size: 0.95rem;
      padding: 10px;
      background-color: #81c784;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .shop-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .close-btn {
      background-color: #888;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .system-btn {
      margin-top: 30px;
      font-size: 0.8rem;
      padding: 5px 10px;
      background-color: #e0e0e0;
      color: #666;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ポップアニメーション */
    .pop-number {
      position: absolute;
      font-size: 1.8rem;
      font-weight: bold;
      color: #2e7d32;
      pointer-events: none;
      animation: popUp 0.6s ease-out forwards;
      z-index: 100;
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { opacity: 0.9; transform: translateY(-40px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
    }
  </style>
</head>
<body>

  <div class="score-board">
    そらまめ: <span id="mame-count">0</span> 個
  </div>

  <!-- そらまめと農家の人たちのステージ -->
  <div class="game-stage">
    <div id="farmer-field" class="farmer-container"></div>
    <button id="harvest-btn" class="mame-btn">🫛</button>
  </div>

  <div>
    <button id="open-menu-btn" class="menu-open-btn">🛠 強化メニュー</button>
  </div>

  <div>
    <button id="reset-btn" class="system-btn">データをリセットして最初から</button>
  </div>

  <!-- 強化メニュー モーダル -->
  <div id="shop-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">🛠 強化メニュー</div>
      
      <button id="buy-auto-btn" class="shop-btn" disabled>
        自動収穫機 (所持: <span id="auto-count">0</span>)<br>
        コスト: <span id="auto-cost">10</span> そらまめ
      </button>

      <button id="buy-pesticide-btn" class="shop-btn" style="display: none;" disabled>
        農薬撒き機 🧪 (全自動収穫2倍)<br>
        <span id="pesticide-status">コスト: 50 そらまめ</span>
      </button>

      <button id="buy-farmer-btn" class="shop-btn" style="display: none;" disabled>
        農家の人 🌾 (所持: <span id="farmer-count">0</span>)<br>
        3秒ごとに10個収穫<br>
        コスト: <span id="farmer-cost">500</span> そらまめ
      </button>

      <button id="close-menu-btn" class="close-btn">閉じる</button>
    </div>
  </div>

  <script>
    let mames = 0;
    let autoHarvesterCount = 0;
    let autoHarvesterCost = 10;
    let hasPesticide = false;
    let pesticideCost = 50;
    let farmerCount = 0;
    let farmerCost = 500;

    const mameCountEl = document.getElementById('mame-count');
    const harvestBtn = document.getElementById('harvest-btn');
    const openMenuBtn = document.getElementById('open-menu-btn');
    const closeMenuBtn = document.getElementById('close-menu-btn');
    const shopModal = document.getElementById('shop-modal');
    
    const buyAutoBtn = document.getElementById('buy-auto-btn');
    const autoCostEl = document.getElementById('auto-cost');
    const autoCountEl = document.getElementById('auto-count');
    
    const buyPesticideBtn = document.getElementById('buy-pesticide-btn');
    const pesticideStatusEl = document.getElementById('pesticide-status');

    const buyFarmerBtn = document.getElementById('buy-farmer-btn');
    const farmerCountEl = document.getElementById('farmer-count');
    const farmerCostEl = document.getElementById('farmer-cost');
    const farmerField = document.getElementById('farmer-field');

    const resetBtn = document.getElementById('reset-btn');

    function saveGame() {
      const saveData = {
        mames: mames,
        autoHarvesterCount: autoHarvesterCount,
        autoHarvesterCost: autoHarvesterCost,
        hasPesticide: hasPesticide,
        farmerCount: farmerCount,
        farmerCost: farmerCost
      };
      localStorage.setItem('soramame_kingdom_save', JSON.stringify(saveData));
    }

    function loadGame() {
      const savedData = localStorage.getItem('soramame_kingdom_save');
      if (savedData !== null) {
        const data = JSON.parse(savedData);
        mames = data.mames || 0;
        autoHarvesterCount = data.autoHarvesterCount || 0;
        autoHarvesterCost = data.autoHarvesterCost || 10;
        hasPesticide = data.hasPesticide || false;
        farmerCount = data.farmerCount || 0;
        farmerCost = data.farmerCost || 500;
      }
    }

    // 🌾 農家の人を表示する関数（まめの左右にどーーんと出現！）
    function renderFarmers() {
      farmerField.innerHTML = '';
      const displayCount = Math.min(farmerCount, 4); // 左右に2人ずつまで配置
      for (let i = 0; i < displayCount; i++) {
        const farmer = document.createElement('div');
        farmer.className = 'farmer-char';
        farmer.textContent = '👨‍🌾';
        farmerField.appendChild(farmer);
      }
    }

    function updateDisplay() {
      mameCountEl.textContent = mames;
      autoCostEl.textContent = autoHarvesterCost;
      autoCountEl.textContent = autoHarvesterCount;
      buyAutoBtn.disabled = (mames < autoHarvesterCost);

      if (autoHarvesterCount >= 1 || hasPesticide) {
        buyPesticideBtn.style.display = "block";
        if (hasPesticide) {
          buyPesticideBtn.disabled = true;
          pesticideStatusEl.textContent = "購入済み (効果: 2倍適用中！)";
        } else {
          buyPesticideBtn.disabled = (mames < pesticideCost);
          pesticideStatusEl.textContent = `コスト: ${pesticideCost} そらまめ`;
        }
      } else {
        buyPesticideBtn.style.display = "none";
      }

      if (autoHarvesterCount >= 10 || farmerCount > 0) {
        buyFarmerBtn.style.display = "block";
        farmerCountEl.textContent = farmerCount;
        farmerCostEl.textContent = farmerCost;
        buyFarmerBtn.disabled = (mames < farmerCost);
      } else {
        buyFarmerBtn.style.display = "none";
      }

      renderFarmers();
    }

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (event) => {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    function createPopNumber(e) {
      const pop = document.createElement('div');
      pop.className = 'pop-number';
      pop.textContent = '+1';

      let x, y;
      if (e.touches && e.touches.length > 0) {
        x = e.touches[0].clientX;
        y = e.touches[0].clientY;
      } else {
        x = e.clientX;
        y = e.clientY;
      }

      const randomOffsetX = (Math.random() - 0.5) * 30;
      pop.style.left = `${x + randomOffsetX - 15}px`;
      pop.style.top = `${y - 30}px`;

      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    harvestBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      mames += 1;
      updateDisplay();
      saveGame();
      createPopNumber(e);
    });
    harvestBtn.addEventListener('mousedown', (e) => {
      if (!('ontouchstart' in window)) {
        mames += 1;
        updateDisplay();
        saveGame();
        createPopNumber(e);
      }
    });

    openMenuBtn.addEventListener('click', () => { shopModal.style.display = 'flex'; });
    closeMenuBtn.addEventListener('click', () => { shopModal.style.display = 'none'; });

    buyAutoBtn.addEventListener('click', () => {
      if (mames >= autoHarvesterCost) {
        mames -= autoHarvesterCost;
        autoHarvesterCount += 1;
        autoHarvesterCost = Math.floor(autoHarvesterCost * 1.5);
        updateDisplay();
        saveGame();
      }
    });

    buyPesticideBtn.addEventListener('click', () => {
      if (!hasPesticide && mames >= pesticideCost) {
        mames -= pesticideCost;
        hasPesticide = true;
        updateDisplay();
        saveGame();
      }
    });

    buyFarmerBtn.addEventListener('click', () => {
      if (mames >= farmerCost) {
        mames -= farmerCost;
        farmerCount += 1;
        farmerCost = Math.floor(farmerCost * 1.5);
        updateDisplay();
        saveGame();
      }
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('本当にリセットしますか？')) {
        localStorage.removeItem('soramame_kingdom_save');
        mames = 0;
        autoHarvesterCount = 0;
        autoHarvesterCost = 10;
        hasPesticide = false;
        farmerCount = 0;
        farmerCost = 500;
        updateDisplay();
      }
    });

    setInterval(() => {
      if (autoHarvesterCount > 0) {
        const multiplier = hasPesticide ? 2 : 1;
        mames += (autoHarvesterCount * multiplier);
        updateDisplay();
        saveGame();
      }
    }, 1000);

    setInterval(() => {
      if (farmerCount > 0) {
        const multiplier = hasPesticide ? 2 : 1;
        mames += (farmerCount * 10 * multiplier);
        updateDisplay();
        saveGame();
      }
    }, 3000);

    loadGame();
    updateDisplay();
  </script>
</body>
</html>
